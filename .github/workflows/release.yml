name: Build and Release

on:
  push:
    branches: [main]

# Restrict the GITHUB_TOKEN to only what's needed
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15  # Apple Silicon runner

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Use Command Line Tools only (no Xcode)
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Install just
        run: brew install just

      - name: Build and bundle
        run: just build-release

      - name: Set build metadata
        run: |
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Package .app as zip
        run: cd .build && ditto -c -k --keepParent utv.app utv-macos-arm64.zip

      - name: Create dated release
        run: |
          gh release create "${BUILD_DATE}-${SHA_SHORT}" \
            --title "${BUILD_DATE}-${SHA_SHORT}" \
            --notes "Built from commit ${GITHUB_SHA}" \
            .build/utv-macos-arm64.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Update latest release
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            --title "Latest" \
            --notes "Built from commit ${GITHUB_SHA}" \
            --prerelease \
            .build/utv-macos-arm64.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
